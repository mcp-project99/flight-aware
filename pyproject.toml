[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "adsb-feeder-health"
version = "0.1.0"
description = "Privacy-first local health checks for ADS-B feeder devices"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "mcp-project99" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]

[project.scripts]
adsb-feeder-health = "feeder_health.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
